        Variables: 
          BUCKET: !Ref BucketLanding 
          ENV_INGESTA: !Ref Env
          SKYCOP_TOKEN_SECRET_NAME: !Ref SkycopApiSecret
          SECRET_NAME: !Ref SecretName
          REGION: !Ref Region
          KEY: !Ref KeyLanding 
      Layers:  
        - !Ref AwsRequestLayer
        - !Ref AwsWranglerLayer
        - !Ref RequestLayer
      

  SkycopRecorridoFunction: 
    Type: AWS::Serverless::Function 
    Properties: 
      FunctionName: skycop_recorrido
      Description: Extrae datos del recorrido de los equipos
      CodeUri: functions/skycop_recorrido/
      Handler: lambda_function.lambda_handler 
      Runtime: python3.9 
      Timeout: 900
      MemorySize: 3008 
      Architectures: 
        - x86_64 
      Environment: 
        Variables: 
          BUCKET: !Ref BucketLanding  
          ENV_INGESTA: !Ref Env
          SKYCOP_TOKEN_SECRET_NAME: !Ref SkycopApiSecret
          SECRET_NAME: !Ref SecretName
          REGION: !Ref Region
          KEY: !Ref KeyLanding
      Layers:  
        - !Ref AwsRequestLayer
        - !Ref AwsWranglerLayer
        - !Ref RequestLayer
      

  SkycopExcesosFunction: 
    Type: AWS::Serverless::Function 
    Properties: 
      FunctionName: skycop_excesos 
      Description: Extrae los excesos de velocidad registrados de toda la flota
      CodeUri: functions/skycop_excesos/
      Handler: lambda_function.lambda_handler 
      Runtime: python3.9 
      Timeout: 900
      MemorySize: 3008 
      Architectures: 
        - x86_64 
