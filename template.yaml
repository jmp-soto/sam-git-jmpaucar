  SkycopRecargaCombustibleFunction: 
    Type: AWS::Serverless::Function 
    Properties: 
      FunctionName: skycop_recarga_combustible 
      Description: Extrae los datos registrados de recarga de combustible de toda la flota
      CodeUri: functions/skycop_recarga_combustible/
